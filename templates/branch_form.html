{% extends 'base.html' %}{% block page_title %}{{'지점 수정' if branch else '지점 등록'}}{% endblock %}{% block content %}<section class="panel narrow"><form method="post" class="stack"><label>지점명<input name="name" value="{{branch.name if branch else ''}}" required></label><label>지점코드<input name="code" value="{{branch.code if branch else ''}}"></label><label>주소<input name="address" value="{{branch.address if branch else ''}}"></label><label>연락처<input name="phone" value="{{branch.phone if branch else ''}}"></label><label>담당자<input name="manager_name" value="{{branch.manager_name if branch else ''}}"></label>{% if branch %}<label>운영상태<select name="active"><option value="1" {% if branch.active %}selected{% endif %}>운영중</option><option value="0" {% if not branch.active %}selected{% endif %}>중지</option></select></label>{% endif %}<label>메모<textarea name="memo">{{branch.memo if branch else ''}}</textarea></label><button class="btn primary">저장</button></form></section>{% endblock %}
