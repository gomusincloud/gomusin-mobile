{% extends 'base.html' %}{% block page_title %}{{'고객 수정' if customer else '고객 등록'}}{% endblock %}{% block content %}<section class="panel form-panel"><form method="post" class="form-grid"><label>고객명 *<input name="name" required value="{{customer.name if customer else ''}}"></label><label>전화번호<input name="phone" value="{{customer.phone if customer else ''}}"></label><label>통신사<select name="carrier"><option value="">선택</option>{% for x in ['SK','KT','LG'] %}<option {% if customer and customer.carrier==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>상태<select name="status">{% for x in ['상담중','개통고객','보류','완료'] %}<option {% if customer and customer.status==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label class="span-4">메모<textarea name="memo" rows="5">{{customer.memo if customer else ''}}</textarea></label><div class="form-actions span-4"><a class="btn" href="{{url_for('customers')}}">취소</a><button class="btn primary">저장</button></div></form></section>{% endblock %}
