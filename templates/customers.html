
{% extends "base.html" %}{% block content %}
<div class="pagehead"><h1>고객관리</h1><a class="btn" href="{{url_for('customer_new')}}">+ 고객 등록</a></div>
<form class="search"><input name="q" value="{{q}}" placeholder="고객명 또는 연락처 검색"><button>검색</button></form>
<section><table><tr><th>고객명</th><th>연락처</th><th>기종</th><th>통신사</th><th>상태</th><th>관리</th></tr>
{% for c in customers %}<tr><td>{{c.name}}</td><td>{{c.phone or '-'}}</td><td>{{c.device or '-'}}</td><td>{{c.carrier or '-'}}</td><td><span class="badge">{{c.status}}</span></td><td><a href="{{url_for('customer_edit',id=c.id)}}">수정</a> <form class="inline" method="post" action="{{url_for('customer_delete',id=c.id)}}" onsubmit="return confirm('삭제할까요?')"><button class="link danger">삭제</button></form></td></tr>{% else %}<tr><td colspan="6">등록된 고객이 없습니다.</td></tr>{% endfor %}</table></section>
{% endblock %}
