{% extends 'base.html' %}{% block page_title %}재고 지점이동{% endblock %}{% block content %}
<section class="panel narrow"><h2>{{item.model}} · {{item.serial_number}}</h2><p class="muted">현재지점: <b>{{current_branch.name if current_branch else '미지정'}}</b></p><form method="post" class="stack"><label>이동할 지점<select name="to_branch_id" required><option value="">선택</option>{% for b in branches %}{% if b.id!=item.branch_id %}<option value="{{b.id}}">{{b.name}}</option>{% endif %}{% endfor %}</select></label><label>이동 메모<textarea name="memo" placeholder="예: 2호점 판매용 이동"></textarea></label><div class="action-row"><a class="btn" href="{{url_for('inventory_detail',iid=item.id)}}">취소</a><button class="btn primary">지점이동 완료</button></div></form></section>{% endblock %}
