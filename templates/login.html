
{% extends "base.html" %}{% block login_content %}
<div class="login-wrap"><form class="login-card" method="post">
<h1>고무신<span>모바일</span></h1><p>통합 매장 관리시스템</p>
{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}
<label>아이디</label><input name="username" required>
<label>비밀번호</label><input type="password" name="password" required>
<button>로그인</button><small>초기 관리자: admin / 1234<br>실제 운영 전 반드시 비밀번호를 변경하세요.</small>
</form></div>{% endblock %}
