<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고무신모바일 로그인</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="login-body"><div class="login-card"><div class="login-logo">G</div><h1>고무신모바일</h1><p>통합 매장 관리시스템</p>{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash error">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="stack"><label>아이디<input name="username" required autofocus></label><label>비밀번호<input type="password" name="password" required></label><button class="btn primary wide">로그인</button></form></div></body></html>
