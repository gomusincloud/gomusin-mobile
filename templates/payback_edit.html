{% extends 'base.html' %}{% block page_title %}페이백 수정{% endblock %}{% block content %}<section class="panel narrow"><h2>{{sale.customer_name if sale else '고객'}} 페이백</h2><form method="post" class="stack"><label>페이백 금액<input name="amount" value="{{p.amount}}" required></label><label>지급예정일<input type="date" name="due_date" value="{{p.due_date.isoformat() if p.due_date else ''}}"></label><label>처리상태<select name="status">{% for v in ['처리예정','완료','보류','취소'] %}<option {% if p.status==v %}selected{% endif %}>{{v}}</option>{% endfor %}</select></label><label>은행<input name="bank" value="{{p.bank or ''}}"></label><label>계좌번호<input name="account_number" value="{{p.account_number or ''}}"></label><label>예금주<input name="account_holder" value="{{p.account_holder or ''}}"></label><label>메모<textarea name="memo">{{p.memo or ''}}</textarea></label><div class="action-row"><a class="btn" href="{{url_for('paybacks')}}">취소</a><button class="btn primary">수정 저장</button></div></form></section>{% endblock %}
