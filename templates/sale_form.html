{% extends "base.html" %}

{% block content %}

<style>
    .sale-page {
        max-width: 1200px;
        margin: 0 auto;
        padding-bottom: 50px;
    }

    .sale-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
    }

    .sale-header h1 {
        margin: 0;
        font-size: 28px;
    }

    .sale-header p {
        margin: 7px 0 0;
        color: #777;
        font-size: 14px;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        color: #333;
        text-decoration: none;
    }

    .form-card {
        background: #fff;
        border: 1px solid #e5e5e5;
        border-radius: 14px;
        margin-bottom: 20px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .section-title {
        padding: 17px 22px;
        background: #f8f9fb;
        border-bottom: 1px solid #e5e5e5;
        font-size: 17px;
        font-weight: 700;
    }

    .section-title span {
        margin-right: 7px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        padding: 22px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 7px;
    }

    .form-group.full {
        grid-column: 1 / -1;
    }

    .form-group label {
        font-size: 14px;
        font-weight: 700;
        color: #333;
    }

    .required {
        color: #e53935;
        margin-left: 3px;
    }

    .form-control {
        width: 100%;
        box-sizing: border-box;
        height: 44px;
        padding: 0 13px;
        border: 1px solid #d8dce2;
        border-radius: 8px;
        background: #fff;
        font-size: 14px;
        outline: none;
        transition: border-color .15s, box-shadow .15s;
    }

    textarea.form-control {
        height: 110px;
        padding: 12px 13px;
        resize: vertical;
    }

    .form-control:focus {
        border-color: #222;
        box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
    }

    .help-text {
        color: #888;
        font-size: 12px;
    }

    .money-wrap {
        position: relative;
    }

    .money-wrap .form-control {
        padding-right: 35px;
    }

    .money-unit {
        position: absolute;
        right: 13px;
        top: 50%;
        transform: translateY(-50%);
        color: #777;
        font-size: 13px;
    }

    .bottom-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 10px;
    }

    .btn-cancel,
    .btn-submit {
        height: 46px;
        padding: 0 24px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
    }

    .btn-cancel {
        background: #fff;
        color: #333;
        border: 1px solid #d8dce2;
    }

    .btn-submit {
        border: none;
        background: #111;
        color: #fff;
    }

    .btn-submit:hover {
        background: #333;
    }

    .notice {
        margin: 0 22px 22px;
        padding: 13px 15px;
        background: #f5f7fa;
        border-radius: 8px;
        color: #666;
        font-size: 13px;
        line-height: 1.6;
    }

    @media (max-width: 700px) {
        .sale-page {
            padding: 0 10px 40px;
        }

        .sale-header {
            align-items: flex-start;
            gap: 12px;
        }

        .sale-header h1 {
            font-size: 23px;
        }

        .form-grid {
            grid-template-columns: 1fr;
            padding: 16px;
        }

        .form-group.full {
            grid-column: auto;
        }

        .section-title {
            padding: 15px 16px;
        }

        .notice {
            margin: 0 16px 16px;
        }

        .bottom-actions {
            flex-direction: column-reverse;
        }

        .btn-cancel,
        .btn-submit {
            width: 100%;
        }
    }
</style>


<div class="sale-page">

    <!-- =========================
         페이지 제목
    ========================== -->

    <div class="sale-header">

        <div>
            <h1>신규개통 등록</h1>
            <p>신규 개통 고객의 개통 정보를 등록합니다.</p>
        </div>

        <a
            href="{{ url_for('sales') }}"
            class="back-btn"
        >
            ← 개통내역
        </a>

    </div>


    <!-- =========================
         고객 기본정보
    ========================== -->

    <div class="form-card">

        <div class="section-title">
            <span>👤</span>
            고객 기본정보
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    고객명
                    <span class="required">*</span>
                </label>

                <input
                    type="text"
                    name="customer_name"
                    class="form-control"
                    placeholder="고객명을 입력하세요"
                    required
                    form="saleForm"
                >

            </div>


            <div class="form-group">

                <label>
                    고객 연락처
                </label>

                <input
                    type="tel"
                    name="customer_phone"
                    class="form-control"
                    placeholder="010-0000-0000"
                    form="saleForm"
                >

            </div>

        </div>

    </div>


    <!-- =========================
         개통 기본정보
    ========================== -->

    <div class="form-card">

        <div class="section-title">
            <span>📱</span>
            개통 기본정보
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    개통일
                    <span class="required">*</span>
                </label>

                <input
                    type="date"
                    name="opening_date"
                    class="form-control"
                    value="{{ today if today is defined else '' }}"
                    required
                    form="saleForm"
                >

            </div>


            <div class="form-group">

                <label>
                    통신사
                </label>

                <select
                    name="carrier"
                    class="form-control"
                    form="saleForm"
                >

                    <option value="">통신사 선택</option>
                    <option value="SKT">SKT</option>
                    <option value="KT">KT</option>
                    <option value="LG U+">LG U+</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    개통 유형
                </label>

                <select
                    name="opening_type"
                    class="form-control"
                    form="saleForm"
                >

                    <option value="">개통 유형 선택</option>
                    <option value="신규가입">신규가입</option>
                    <option value="번호이동">번호이동</option>
                    <option value="기기변경">기기변경</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    개통 상태
                </label>

                <select
                    name="status"
                    class="form-control"
                    form="saleForm"
                >

                    <option value="개통완료">개통완료</option>
                    <option value="개통예정">개통예정</option>
                    <option value="개통대기">개통대기</option>
                    <option value="개통취소">개통취소</option>

                </select>

            </div>

        </div>

    </div>


    <!-- =========================
         단말기 정보
    ========================== -->

    <div class="form-card">

        <div class="section-title">
            <span>📲</span>
            단말기 정보
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    단말기
                </label>

                <input
                    type="text"
                    name="device"
                    class="form-control"
                    placeholder="예: 갤럭시 S26 울트라"
                    form="saleForm"
                >

            </div>


            <div class="form-group">

                <label>
                    색상
                </label>

                <input
                    type="text"
                    name="color"
                    class="form-control"
                    placeholder="예: 블랙"
                    form="saleForm"
                >

            </div>


            <div class="form-group">

                <label>
                    용량
                </label>

                <select
                    name="storage"
                    class="form-control"
                    form="saleForm"
                >

                    <option value="">용량 선택</option>
                    <option value="128GB">128GB</option>
                    <option value="256GB">256GB</option>
                    <option value="512GB">512GB</option>
                    <option value="1TB">1TB</option>

                </select>

            </div>

        </div>

    </div>


    <!-- =========================
         요금제 / 계약정보
    ========================== -->

    <div class="form-card">

        <div class="section-title">
            <span>📄</span>
            요금제 / 계약정보
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    요금제
                </label>

                <input
                    type="text"
                    name="plan"
                    class="form-control"
                    placeholder="예: 99,000원 요금제"
                    form="saleForm"
                >

            </div>


            <div class="form-group">

                <label>
                    약정 유형
                </label>

                <select
                    name="contract_type"
                    class="form-control"
                    form="saleForm"
                >

                    <option value="">약정 유형 선택</option>
                    <option value="공시지원금">공시지원금</option>
                    <option value="선택약정">선택약정</option>
                    <option value="자급제">자급제</option>
                    <option value="무약정">무약정</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    할부개월
                </label>

                <select
                    name="installment_months"
                    class="form-control"
                    form="saleForm"
                >

                    <option value="">선택</option>
                    <option value="0">일시불</option>
                    <option value="12">12개월</option>
                    <option value="24">24개월</option>
                    <option value="30">30개월</option>
                    <option value="36">36개월</option>
                    <option value="48">48개월</option>

                </select>

            </div>

        </div>

    </div>


    <!-- =========================
         금액정보
    ========================== -->

    <div class="form-card">

        <div class="section-title">
            <span>💰</span>
            금액정보
        </div>

        <div class="form-grid">

            <div class="form-group">

                <label>
                    출고가
                </label>

                <div class="money-wrap">

                    <input
                        type="text"
                        name="device_price"
                        class="form-control money-input"
                        placeholder="0"
                        inputmode="numeric"
                        form="saleForm"
                    >

                    <span class="money-unit">원</span>

                </div>

            </div>


            <div class="form-group">

                <label>
                    지원금
                </label>

                <div class="money-wrap">

                    <input
                        type="text"
                        name="subsidy"
                        class="form-control money-input"
                        placeholder="0"
                        inputmode="numeric"
                        form="saleForm"
                    >

                    <span class="money-unit">원</span>

                </div>

            </div>


            <div class="form-group">

                <label>
                    할부원금
                </label>

                <div class="money-wrap">

                    <input
                        type="text"
                        name="installment_price"
                        class="form-control money-input"
                        placeholder="0"
                        inputmode="numeric"
                        form="saleForm"
                    >

                    <span class="money-unit">원</span>

                </div>

            </div>


            <div class="form-group">

                <label>
                    현금완납
                </label>

                <div class="money-wrap">

                    <input
                        type="text"
                        name="cash_price"
                        class="form-control money-input"
                        placeholder="0"
                        inputmode="numeric"
                        form="saleForm"
                    >

                    <span class="money-unit">원</span>

                </div>

            </div>


            <div class="form-group">

                <label>
                    월 납부금
                </label>

                <div class="money-wrap">

                    <input
                        type="text"
                        name="monthly_payment"
                        class="form-control money-input"
                        placeholder="0"
                        inputmode="numeric"
                        form="saleForm"
                    >

                    <span class="money-unit">원</span>

                </div>

            </div>

        </div>

        <div class="notice">
            금액은 숫자만 입력해도 됩니다. 예: 550000 → 550,000원
        </div>

    </div>


    <!-- =========================
         메모
    ========================== -->

    <div class="form-card">

        <div class="section-title">
            <span>📝</span>
            메모
        </div>

        <div class="form-grid">

            <div class="form-group full">

                <label>
                    상담 / 개통 메모
                </label>

                <textarea
                    name="memo"
                    class="form-control"
                    placeholder="고객 요청사항, 사은품, 특이사항 등을 입력하세요."
                    form="saleForm"
                ></textarea>

            </div>

        </div>

    </div>


    <!-- =========================
         등록 버튼
    ========================== -->

    <form
        id="saleForm"
        method="POST"
        action="{{ url_for('sale_new') }}"
    >

        <!-- 실제 입력값들은 위에서 form="saleForm"으로 연결되어 있음 -->

        <div class="bottom-actions">

            <a
                href="{{ url_for('sales') }}"
                class="btn-cancel"
            >
                취소
            </a>

            <button
                type="submit"
                class="btn-submit"
            >
                신규개통 등록
            </button>

        </div>

    </form>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    /*
     * 금액 입력
     * 1000000 → 1,000,000
     */

    const moneyInputs =
        document.querySelectorAll(".money-input");

    moneyInputs.forEach(function(input) {

        input.addEventListener("input", function() {

            let value =
                this.value.replace(/[^0-9]/g, "");

            if (value) {

                this.value =
                    Number(value).toLocaleString("ko-KR");

            } else {

                this.value = "";

            }

        });

        input.addEventListener("focus", function() {

            this.value =
                this.value.replace(/,/g, "");

        });

        input.addEventListener("blur", function() {

            let value =
                this.value.replace(/[^0-9]/g, "");

            if (value) {

                this.value =
                    Number(value).toLocaleString("ko-KR");

            }

        });

    });


    /*
     * 연락처 자동 하이픈
     */

    const phoneInput =
        document.querySelector(
            'input[name="customer_phone"]'
        );

    if (phoneInput) {

        phoneInput.addEventListener(
            "input",
            function() {

                let value =
                    this.value.replace(/[^0-9]/g, "");

                if (value.length <= 3) {

                    this.value = value;

                } else if (value.length <= 7) {

                    this.value =
                        value.slice(0, 3) +
                        "-" +
                        value.slice(3);

                } else {

                    this.value =
                        value.slice(0, 3) +
                        "-" +
                        value.slice(3, 7) +
                        "-" +
                        value.slice(7, 11);

                }

            }
        );

    }


    /*
     * 폼 제출 전 금액의 콤마 제거
     *
     * DB에는 숫자 형태의 문자열로 저장되도록
     */

    const form =
        document.getElementById("saleForm");

    if (form) {

        form.addEventListener(
            "submit",
            function() {

                moneyInputs.forEach(function(input) {

                    input.value =
                        input.value.replace(/,/g, "");

                });

            }
        );

    }

});

</script>

{% endblock %}
